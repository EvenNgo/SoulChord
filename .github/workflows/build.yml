name: Build Windows VST3

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Theory unit tests
        run: |
          g++ -std=c++17 -O1 -ISource tests/theory_test.cpp Source/Theory.cpp Source/Arranger.cpp -o theory_test
          ./theory_test

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.9-${{ runner.os }}

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --target SoulChord_VST3 SoulChord_Standalone --parallel

      - name: Validate with pluginval
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 5 --skip-gui-tests --validate-in-process --output-dir pluginval-logs "build/SoulChord_artefacts/Release/VST3/SoulChord.vst3"

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse "build/SoulChord_artefacts/Release/VST3/SoulChord.vst3" dist/
          Copy-Item "build/SoulChord_artefacts/Release/Standalone/SoulChord.exe" dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath SoulChord-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoulChord-Windows
          path: dist/

      - name: Upload pluginval log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pluginval-log
          path: pluginval-logs
          if-no-files-found: ignore

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SoulChord-Windows.zip
